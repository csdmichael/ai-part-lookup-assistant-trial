name: Deploy to Azure (Dev)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  package:
    name: Build deployment package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API and UI
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Assemble App Service bundle
        run: |
          mkdir -p package/wwwroot
          cp -r server/dist package/dist
          cp server/package.json package/package.json
          cp -r web/dist/. package/wwwroot/
          cd package
          npm install --omit=dev --no-package-lock --no-audit --no-fund

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: part-lookup-app
          path: package
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: package
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: part-lookup-app
          path: package

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: package
